name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: v1/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt ruff
      - name: Lint (syntax errors and pyflakes)
        run: ruff check src tests eval --select E9,F
      - name: Tests
        run: python -m pytest
      - name: Demo runs end to end
        run: |
          PYTHONPATH=src:. python -m cis.cli demo > /dev/null
          PYTHONPATH=src:. python -m cis.cli framework --framework examples/spiced.yaml > /dev/null
